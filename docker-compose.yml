services:
  wayfinding-map-builder:
    build: .
    image: wayfinding-map-builder:latest
    container_name: wayfinding-map-builder
    ports:
      # Only this computer: http://localhost:8088
      # To expose it on the local network, change to "8088:80"
      - "127.0.0.1:8088:80"
    restart: unless-stopped
