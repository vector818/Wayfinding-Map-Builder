server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirects keep the port you opened (e.g. localhost:8088) instead of the container's port 80
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Short links for the two language versions: /pl and /en
    location ~ ^/(pl|en)/?$ {
        return 302 /?lang=$1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
